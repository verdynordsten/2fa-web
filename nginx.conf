server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Static assets: cache hard, content is hashed by deploy
  location ~* \.(js|css|png|jpg|svg|ico|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # SEO and PWA files: serve exact, never fallback to index
  location = /robots.txt {
    expires 1d;
    add_header Cache-Control "public";
  }
  location = /sitemap.xml {
    expires 1d;
    add_header Cache-Control "public";
  }
  location = /manifest.webmanifest {
    expires 7d;
    add_header Cache-Control "public";
    add_header Content-Type "application/manifest+json";
  }

  # HTML: always fresh so new deploys show instantly
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }

  gzip on;
  gzip_types text/css application/javascript text/html application/json;
}
